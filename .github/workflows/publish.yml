name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# Trusted publishing: npm exchanges the GitHub OIDC token for a short-lived
# publish credential, so there is no NPM_TOKEN secret to expire or leak, and
# provenance is attached automatically. Requires the trusted publisher to be
# configured on npmjs.com for this repo and this workflow file.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      # A tag on a broken commit must not reach the registry.
      - run: npm test

      - name: Set dist-tag
        id: tag
        run: |
          if [[ "${{ github.ref_name }}" == *"-beta"* ]]; then
            echo "dist_tag=beta" >> $GITHUB_OUTPUT
          else
            echo "dist_tag=latest" >> $GITHUB_OUTPUT
          fi

      - run: npm publish --access public --tag ${{ steps.tag.outputs.dist_tag }}
